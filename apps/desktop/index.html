<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>知记 - 个人会议纪要与笔记本</title>
    <script>
      // 首帧前应用外观主题，避免深色用户启动闪白（与 src/zhiji/theme.ts 保持同键同逻辑）
      (function () {
        try {
          var raw = localStorage.getItem("zhiji:theme");
          var theme =
            raw === "light" || raw === "dark"
              ? raw
              : window.matchMedia &&
                  window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          /* localStorage 不可用时保持默认浅色 */
        }
      })();
    </script>
  </head>
  <body spellcheck="false">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
